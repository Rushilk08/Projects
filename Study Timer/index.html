<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tide – Focus Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="focus">

<div class="readout" aria-hidden="true"><span class="label">Focus</span><span class="time">25:00</span></div>
<div class="tide" aria-hidden="true">
  <div class="readout light"><span class="label">Focus</span><span class="time">25:00</span></div>
</div>

<header class="bar">
  <div class="brand">Tide</div>
  <div class="streak" title="Consecutive days with at least one focus session">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-6 1 2 2 2 2 2 1-3 1-5 1-8z" fill="currentColor"/></svg>
    <b id="streak">0</b><span id="streakWord">day streak</span>
  </div>
</header>

<main class="dock">
  <p class="sr" id="live" role="status" aria-live="polite"></p>
  <nav class="modes" aria-label="Timer mode">
    <button data-mode="focus" aria-pressed="true"><kbd>1</kbd> Focus</button>
    <button data-mode="short" aria-pressed="false"><kbd>2</kbd> Short break</button>
    <button data-mode="long" aria-pressed="false"><kbd>3</kbd> Long break</button>
  </nav>
  <div class="controls">
    <button id="reset" class="ghost" aria-label="Reset"><kbd>R</kbd> Reset</button>
    <button id="toggle" class="primary"><kbd>Space</kbd> <span>Start</span></button>
    <button id="skip" class="ghost" aria-label="Skip"><kbd>S</kbd> Skip</button>
  </div>
  <div class="meta">
    <div class="pips" id="pips" aria-label="Cycle progress"></div>
    <span id="today">0 sessions today</span>
    <button id="helpBtn" class="link"><kbd>?</kbd> Shortcuts</button>
  </div>
</main>

<dialog id="help">
  <h2>Keyboard shortcuts</h2>
  <dl>
    <dt><kbd>Space</kbd></dt><dd>Start or pause</dd>
    <dt><kbd>R</kbd></dt><dd>Reset current timer</dd>
    <dt><kbd>S</kbd></dt><dd>Skip to the next phase</dd>
    <dt><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></dt><dd>Focus, short break, long break</dd>
    <dt><kbd>↑</kbd> <kbd>↓</kbd></dt><dd>Add or remove a minute (when paused)</dd>
    <dt><kbd>A</kbd></dt><dd>Auto-start next phase: <b id="autoState">off</b></dd>
    <dt><kbd>M</kbd></dt><dd>Sound: <b id="soundState">on</b></dd>
    <dt><kbd>?</kbd></dt><dd>Show or hide this panel</dd>
  </dl>
  <button class="primary" id="closeHelp"><kbd>Esc</kbd> Close</button>
</dialog>
<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wayfare – Trip planner</title>
  <meta name="description" content="Plan trips in one place: destinations, a day-by-day itinerary, and a budget that stays honest.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app">
    <aside class="sidebar" aria-label="Your trips">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M9 21c3-1 4-5 7-5s4 4 7 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="9" cy="21" r="2" fill="currentColor"/>
          <circle cx="23" cy="21" r="2" fill="currentColor"/>
          <circle cx="16" cy="11" r="2" fill="currentColor"/>
        </svg>
        <span class="brand-name">Wayfare</span>
      </div>

      <nav id="tripList" class="trip-list" aria-label="Trips"></nav>

      <div class="side-actions">
        <button type="button" class="btn btn-accent btn-block" data-action="new-trip">New trip</button>
        <div class="side-tools">
          <button type="button" class="link-btn" data-action="export">Export data</button>
          <button type="button" class="link-btn" data-action="import">Import data</button>
        </div>
      </div>
    </aside>

    <main id="main" class="main" tabindex="-1">
      <div id="view"></div>
    </main>
  </div>

  <dialog id="dialog" aria-labelledby="dialogTitle"></dialog>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="App.js"></script>
</body>
</html>
